name: cletus_mccoy.android_adb

on:
  push:
    branches: [main]
    paths:
      - 'cletus_mccoy/android_adb/**'
      - '.github/workflows/android_adb.yml'
  pull_request:
    paths:
      - 'cletus_mccoy/android_adb/**'
      - '.github/workflows/android_adb.yml'
  schedule:
    # Weekly, to catch breakage from new ansible-core releases early.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  # ansible-test requires the collection at ansible_collections/<ns>/<name>,
  # so the repo (whose root is the ansible_collections dir) is checked out there.
  COLLECTION_DIR: ansible_collections/cletus_mccoy/android_adb

jobs:
  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.16
          - stable-2.18
          - stable-2.20
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      - name: Run sanity tests
        working-directory: ${{ env.COLLECTION_DIR }}
        run: ansible-test sanity --docker -v --color

  units:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install ansible-core -r ${{ env.COLLECTION_DIR }}/tests/requirements.txt --disable-pip-version-check

      - name: Run unit tests
        working-directory: ${{ env.COLLECTION_DIR }}
        run: pytest -v

  build:
    name: Build collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install ansible-core --disable-pip-version-check

      - name: Build and check tarball contents
        working-directory: ${{ env.COLLECTION_DIR }}
        run: |
          ansible-galaxy collection build --output-path /tmp/build
          tar tzf /tmp/build/*.tar.gz > /tmp/contents.txt
          # Never ship local/dev-only files (see build_ignore in galaxy.yml).
          if grep -E '(\.tar\.gz$|__pycache__|integration_config\.yml$|localcopy\.txt|\.env$)' /tmp/contents.txt; then
            echo "::error::Tarball contains files that must not be published"; exit 1
          fi
