ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: Initial release.
    modules:
    - description: Manage Android device configuration over ADB
      name: adb_config
      namespace: ''
    - description: Connect to (or disconnect from) an Android device over ADB (wireless)
      name: adb_connect
      namespace: ''
    - description: Gather Android device info over ADB
      name: adb_device_info
      namespace: ''
    - description: Manage Android device state over ADB
      name: adb_device_state
      namespace: ''
    - description: Manage ADB port forwards for an Android device
      name: adb_forward
      namespace: ''
    - description: Install an APK on an Android device via ADB
      name: adb_install
      namespace: ''
    - description: Send an Android intent over ADB
      name: adb_intent
      namespace: ''
    - description: Fetch Android logcat output over ADB
      name: adb_logcat
      namespace: ''
    - description: List installed Android packages over ADB
      name: adb_packages
      namespace: ''
    - description: Pair with an Android device over ADB wirelessly
      name: adb_pair
      namespace: ''
    - description: Reboot an Android device via ADB
      name: adb_reboot
      namespace: ''
    - description: Record the screen of an Android device using ADB
      name: adb_screenrecord
      namespace: ''
    - description: Uninstall an app from an Android device via ADB
      name: adb_uninstall
      namespace: ''
    plugins:
      connection:
      - description: Execute Ansible tasks over Android Debug Bridge (ADB)
        name: adb
        namespace: null
      inventory:
      - description: Inventory source for Android devices reachable via ADB
        name: adb_devices
        namespace: null
    release_date: '2026-05-03'
  0.2.0:
    changes:
      minor_changes:
      - New roles adb_bootstrap and android_config; settings_management now uses adb_settings
        instead of raw shell.
      - adb connection plugin - timeouts, retries and error wrapping.
      - adb_config - idempotent ``set`` and new ``settings_delete`` action.
      - adb_connect - idempotent; detects an existing connection and supports ``state=absent``.
      - adb_devices inventory plugin - implemented; parses ``adb devices -l`` and
        groups devices.
      - adb_forward - idempotent (checks ``forward --list``); supports ``state=absent``.
      - adb_install - idempotent via ``package``/``version``; skips the install when
        the version already matches.
      - adb_intent - implemented ``am start``/``startservice``/``broadcast``.
      - adb_reboot - new ``wait``/``wait_timeout`` options wait for ``sys.boot_completed``.
      - adb_uninstall - idempotent; checks ``pm list packages`` first.
      release_summary: First deployment-ready release. Most modules are now idempotent.
    modules:
    - description: Push or pull files to/from an Android device via ADB
      name: adb_files
      namespace: ''
    - description: Manage Android Settings database values over ADB
      name: adb_settings
      namespace: ''
    - description: Run an arbitrary command on an Android device via ADB shell
      name: adb_shell
      namespace: ''
    release_date: '2026-06-10'
  0.2.1:
    changes:
      bugfixes:
      - adb_files, adb_shell - add missing documentation that made Galaxy's import
        fail.
      - adb_settings - correct the Settings DB permission note for Android 16 (``WRITE_SETTINGS``
        is no longer granted to the shell).
      - android_probe role - restore the ``probe_include_system_apps`` default; bare
        runs failed with an undefined variable.
      - app_management role - drop the invalid ``update`` argument and support ``{apk_path,
        package, version}`` items for idempotent installs.
    release_date: '2026-06-10'
  0.3.0:
    changes:
      minor_changes:
      - adb_connect - new ``prune_offline`` option removes stale ``offline`` entries
        left behind by ``adb root``/``tcpip``.
      - module_utils - shared ``ui.py`` helpers plus ``run_adb_binary`` and ``list_devices``.
    modules:
    - description: Set or remove a key in an Android app's shared_prefs XML (root)
      name: adb_app_pref
      namespace: ''
    - description: Restart adbd as root (or non-root) and re-establish the connection
      name: adb_root
      namespace: ''
    - description: Capture a screenshot from an Android device to the controller
      name: adb_screencap
      namespace: ''
    - description: Dump the current UI view hierarchy from an Android device
      name: adb_ui_dump
      namespace: ''
    - description: Tap a UI element by text/resource-id, or at raw coordinates
      name: adb_ui_tap
      namespace: ''
    release_date: '2026-06-12'
  0.4.0:
    changes:
      minor_changes:
      - android_probe role - rebuilt on adb_facts; unreachable devices are skipped
        instead of failing the play.
      - module_utils - every adb call now has a finite timeout (``AdbTimeout``) and
        a hung ADB server is detected and restarted.
    modules:
    - description: Gather Ansible facts from an Android device over ADB
      name: adb_facts
      namespace: ''
    release_date: '2026-06-17'
  0.4.1:
    changes:
      bugfixes:
      - app_management role - ``bulk_update`` passes package/version to adb_install
        so devices already at the target version report ``changed=false``.
      - policy_management role - rewritten onto valid, idempotent module calls; ``remote_wipe``
        now requires ``policy_confirm_wipe=true``.
    release_date: '2026-06-17'
  0.5.0:
    changes:
      bugfixes:
      - adb_intent - errors that ``am`` prints to stderr while exiting 0 are now reported
        as failures.
      minor_changes:
      - adb_facts, adb_connect, adb_shell, adb_pair - new ``adb_server_port`` option
        to use a dedicated ADB server per device.
      - adb_pair - new ``retries``/``retry_delay``/``timeout``; an expired pairing
        dialog fails with ``expired=true`` and an actionable message.
    release_date: '2026-06-17'
  0.6.0:
    changes:
      bugfixes:
      - adb connection plugin - fix documentation schema errors (``name`` key, author
        format).
      - adb_config - document the ``settings_*`` and ``shell`` actions and the ``namespace``/``command``
        options.
      - adb_logcat - remove a duplicated documentation block.
      - collection - fix the ``repository`` link on Galaxy and add ``issues``/``documentation``/``homepage``
        links.
      - collection - published tarballs no longer include previous release tarballs,
        ``__pycache__`` or the local ``tests/integration/integration_config.yml``.
      - modules - correct ``version_added`` values; several modules claimed versions
        (1.0.0 to 1.4.0) that were never released.
      minor_changes:
      - adb_config, adb_device_info, adb_device_state, adb_packages - now honour ``adb_path``
        instead of always using ``adb`` from ``PATH``.
      - all modules - every module now accepts ``device``, ``adb_path`` and ``adb_server_port``,
        so ``module_defaults`` for ``group/cletus_mccoy.android_adb.adb`` no longer
        fails with "Unsupported parameters" on modules that lacked one of them. ``adb_connect``
        and ``adb_pair`` take ``adb_path``/``adb_server_port`` only.
      - collection - ``requires_ansible`` raised to ``>=2.16.0``, the oldest ansible-core
        version that is tested.
    fragments:
    - shared-options-and-packaging.yml
    release_date: '2026-10-03'
