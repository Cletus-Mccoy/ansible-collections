namespace: cletus_mccoy
name: android_adb
version: 0.6.0
readme: README.md
authors:
  - Kasper Daems
description: Manage Android phones, tablets and kiosks over ADB - idempotent app installs, settings, facts, wireless pairing and UI automation, no agent on the device
license:
  - MIT

repository: https://github.com/Cletus-Mccoy/ansible-collections
documentation: https://github.com/Cletus-Mccoy/ansible-collections/tree/main/cletus_mccoy/android_adb#readme
homepage: https://github.com/Cletus-Mccoy/ansible-collections/tree/main/cletus_mccoy/android_adb
issues: https://github.com/Cletus-Mccoy/ansible-collections/issues

tags:
  - android
  - adb
  - automation
  - mobile
  - kiosk
  - device

dependencies: {}

# Keep local/dev-only files out of the published tarball. Without this, every
# previously built tarball, the device-specific integration_config.yml and
# __pycache__ get bundled into the next release.
build_ignore:
  - '*.tar.gz'
  - '**/__pycache__'
  - '*.pyc'
  - .pytest_cache
  - .env
  - localcopy.txt
  - tests/output
  - tests/integration/integration_config.yml
  - .github
  - changelogs/.plugin-cache.yaml
