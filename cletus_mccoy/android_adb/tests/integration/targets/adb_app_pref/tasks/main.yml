---
# Integration test for adb_app_pref. Needs a root shell (run adb_root first) and
# Fully Kiosk (de.ozerov.fully) installed; skipped otherwise.

- name: Check for a root shell and the Fully Kiosk package
  cletus_mccoy.android_adb.adb_shell:
    device: "{{ adb_device }}"
    command: "id -u; pm path de.ozerov.fully >/dev/null 2>&1 && echo fully || echo no-fully"
  register: app_pref_env
  changed_when: false

- name: Run the adb_app_pref tests
  ansible.builtin.include_tasks: app_pref_tests.yml
  when:
    - app_pref_env.stdout_lines[0] | trim == '0'
    - "'no-fully' not in app_pref_env.stdout"

- name: Skip when root or Fully Kiosk is missing
  ansible.builtin.debug:
    msg: "Skipping adb_app_pref tests: needs a root adb shell and de.ozerov.fully installed (got: {{ app_pref_env.stdout_lines | join(', ') }})."
  when: >-
    app_pref_env.stdout_lines[0] | trim != '0'
    or 'no-fully' in app_pref_env.stdout
