---
# Integration test for adb_root. Needs a build that can run adbd as root
# (userdebug/eng, e.g. a phh-Treble GSI); skipped on production phones, where
# `adb root` is refused by design.

- name: Check whether adbd can run as root on this build
  cletus_mccoy.android_adb.adb_shell:
    device: "{{ adb_device }}"
    command: getprop ro.debuggable
  register: debuggable
  changed_when: false

- name: Run the adb_root tests
  ansible.builtin.include_tasks: root_tests.yml
  when: debuggable.stdout | trim == '1'

- name: Skip on production builds
  ansible.builtin.debug:
    msg: "Skipping adb_root tests: ro.debuggable=0 (production build, adbd cannot run as root)."
  when: debuggable.stdout | trim != '1'
